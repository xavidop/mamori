# GoReleaser configuration for mamori.
#
# Library modules (core and providers/*) are released via semver git tags and
# consumed by `go get`; there is nothing to "build" for them. GoReleaser here
# builds and releases the one shipped binary - the mamori CLI - with checksums,
# a changelog, and (in CI) SLSA provenance. The CLI is dual-mode: it is both
# the `mamori` command and a `go vet` tool (`go vet -vettool=mamori`), so the
# `mamori vet` analyzer ships inside it rather than as a separate binary. The
# CLI is additionally published to a Homebrew tap (see brews: below) so
# `brew install xavidop/tap/mamori` works.
version: 2

project_name: mamori

# No before-hooks: GoReleaser's build step runs `go build` in cmd/mamori with
# GOWORK=off (see builds[].env below), which resolves and downloads the module's
# own deps. A `go mod download` hook is both redundant and awkward here (hooks
# are exec'd without a shell, so an env-var prefix is not honored).

builds:
  - id: mamori
    dir: cmd/mamori
    main: .
    binary: mamori
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: mamori
    ids: [mamori]
    name_template: "mamori_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Providers
      regexp: '^.*?feat\((aws|gcp|azure|vault|k8s|consul|doppler|onepassword|sops)\).+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: xavidop
    name: mamori
  draft: false
  prerelease: auto
  name_template: "mamori {{ .Tag }}"
  footer: |
    ---
    **Full module docs:** https://mamorigo.dev

    Library modules are consumed via `go get github.com/xavidop/mamori@{{ .Tag }}`.
    This release ships the `mamori` CLI binary above. It is dual-mode: it works
    as a `go vet` tool too (`go vet -vettool=$(which mamori) ./...`), which runs
    the `mamori vet` analyzer. Install the CLI via `brew install
    xavidop/tap/mamori` or `go install github.com/xavidop/mamori/cmd/mamori@latest`.

# Publishes the mamori CLI archive to a Homebrew tap. The CLI is the only
# shipped binary, so it is the only formula. It doubles as a go-vet tool
# (`go vet -vettool=$(which mamori)`), so installing mamori is all an operator
# needs for both the CLI and the `mamori vet` analyzer.
brews:
  - name: mamori
    ids: [mamori]
    repository:
      owner: xavidop
      name: homebrew-tap
    homepage: "https://mamorigo.dev"
    description: "CLI for the mamori typed config and secrets library: explain, schema, policy, doctor, status"
    license: "MIT"
    test: |
      system "#{bin}/mamori", "version"
