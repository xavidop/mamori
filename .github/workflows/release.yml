name: Release

# Releases are driven by Conventional Commits:
#   0. Before anything is tagged, the Go module release is cut in a scratch
#      clone and installed from outside it (make release-check).
#   1. semantic-release analyzes commits on main, decides the next version,
#      updates CHANGELOG.md, and creates + pushes the git tag (vX.Y.Z).
#   2. GoReleaser builds the mamori CLI binary and creates the GitHub Release
#      with the artifacts, checksums, and SBOM for that tag.
#   3. SLSA provenance is generated for the released artifacts.
#   4. The Go modules get their tags (<dir>/vX.Y.Z), so `go get` and
#      `go install` of a provider, the server, an x/ module or the CLI work
#      outside a clone: see the modules job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags, releases, and commit the changelog
  issues: write # semantic-release success comments
  pull-requests: write
  id-token: write # SLSA / keyless signing

jobs:
  release:
    name: Version & build
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so semantic-release can analyze commits
          persist-credentials: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: cmd/mamori/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      # The Go module release, cut in a scratch clone at a throwaway version and
      # installed from outside it (go install of the CLI, and a program that
      # uses the core, providers, the server and an x/ module), so a release
      # whose modules would not install stops here, before anything is tagged.
      - name: Check the Go module release
        run: make release-check

      # 1. Determine the next version, update CHANGELOG.md, create and push the tag.
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Build and publish the GitHub Release for the tag semantic-release created.
      - name: Run GoReleaser
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Homebrew formula is committed to xavidop/homebrew-tap, a
          # different repository, which GITHUB_TOKEN cannot write to (it is
          # scoped to this repo, so GoReleaser gets 403 "Resource not
          # accessible by integration"). HOMEBREW_TAP_TOKEN must be a PAT (or
          # GitHub App token) with contents:write on the tap repo.
          #
          # The fallback keeps the variable always defined: .goreleaser.yaml
          # interpolates {{ .Env.HOMEBREW_TAP_TOKEN }}, and an undefined env
          # var there is a template error that would fail the ENTIRE release,
          # including artifacts that are otherwise fine. With the fallback, a
          # missing secret degrades to exactly today's behaviour instead.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

      # 3. Export the artifact hashes for the provenance job.
      - name: Export artifact hashes
        id: hashes
        if: steps.semantic.outputs.new_release_published == 'true'
        run: echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.tag }}
      provenance-name: mamori.intoto.jsonl

  # semantic-release tags the root module (vX.Y.Z). On main the other modules
  # require the root and each other through replace directives, at versions
  # that were never tagged; go install refuses a module with a replace, and a
  # module outside a clone cannot use one. internal/tools/release writes a
  # release commit on top of vX.Y.Z, on no branch, where every module requires
  # the modules of this repository at vX.Y.Z, and tags each module
  # <dir>/vX.Y.Z there. The release commit follows from vX.Y.Z's commit, so a
  # re-run makes the same commit and the tags it pushed before still match.
  modules:
    name: Go module tags
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the module tags
    env:
      GOWORK: off
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit vX.Y.Z names, and every tag
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: true # the module tags are pushed with it

      - uses: actions/setup-go@v7
        with:
          go-version-file: cmd/mamori/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Write the release commit and tag the modules
        run: go -C internal/tools run ./release -version "$TAG" -commit "$TAG" -proxy "$RUNNER_TEMP/goproxy" >"$RUNNER_TEMP/tags"

      - name: Install the release from its own proxy before pushing
        run: bash scripts/release-check.sh --version "$TAG" --proxy "$RUNNER_TEMP/goproxy"

      - name: Push the module tags
        run: |
          refs=()
          while read -r tag; do refs+=("refs/tags/$tag"); done <"$RUNNER_TEMP/tags"
          git push origin "${refs[@]}"

      # The same checks through proxy.golang.org and the checksum database, which
      # build the zips from the tags just pushed: a go.sum hash that differs
      # from theirs fails here.
      - name: Install the release from proxy.golang.org
        run: bash scripts/release-check.sh --version "$TAG" --public
