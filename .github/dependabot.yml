version: 2
updates:
  # Every Go module, in one entry so that Dependabot groups an update across
  # modules into a single PR: one entry per module opened a PR per dependency
  # per module, each of which ran the whole CI matrix.
  # .github/scripts/check_dependabot_coverage.py keeps this list equal to the
  # modules CI discovers (CI fails when a module is missing or stale here).
  - package-ecosystem: gomod
    directories:
      # Core module
      - "/"
      # Provider modules (each is its own module)
      - "/providers/aws"
      - "/providers/gcp"
      - "/providers/azure"
      - "/providers/vault"
      - "/providers/k8s"
      - "/providers/consul"
      - "/providers/doppler"
      # Standard library only, so this entry will rarely fire, for the same reason
      # vercel-gc and cloudflare-kv further down are: the coverage check requires
      # every module to be listed regardless of how often it actually fires.
      - "/providers/scaleway-sm"
      - "/providers/onepassword"
      - "/providers/sops"
      - "/providers/etcd"
      # Standard library only, on top of httpcore: the Nacos Open API is plain HTTP
      # and the nacos-sdk-go is deliberately not used. The entry stays so the
      # coverage check passes and so a future dependency is picked up automatically.
      - "/providers/nacos"
      - "/providers/redis"
      - "/providers/postgres"
      - "/providers/mysql"
      - "/providers/sqlite"
      - "/providers/mongodb"
      - "/providers/dynamodb"
      - "/providers/firestore"
      - "/providers/firebase-rc"
      - "/providers/firebase-rtdb"
      - "/providers/s3"
      - "/providers/gcs"
      - "/providers/azblob"
      - "/providers/cosmos"
      - "/providers/launchdarkly"
      - "/providers/unleash"
      - "/providers/flagsmith"
      - "/providers/configcat"
      - "/providers/split"
      - "/providers/growthbook"
      - "/providers/flipt"
      - "/providers/goff"
      - "/providers/posthog"
      - "/providers/viper"
      # Standard library only, so this entry will rarely fire. It stays because the
      # coverage check requires every module to be listed, and a module that is
      # exempt today is the one nobody notices taking a dependency tomorrow.
      - "/providers/vercel-gc"
      # Standard library only, so this entry will rarely fire, for the same reason
      # as vercel-gc above: the coverage check requires every module to be listed.
      - "/providers/cloudflare-kv"
      # Not a provider: the shared HTTP resolve core the REST-backed providers build
      # on. Standard library only, so this entry will rarely fire, and it stays for
      # the same reason as cloudflare-kv above.
      - "/providers/httpcore"
      # Standard library only, on top of httpcore. Same reasoning again.
      # Standard library only, on top of httpcore, and deliberately NOT HashiCorp's
      # hcp-sdk-go. Same reasoning as https below: this entry will rarely fire, and
      # the coverage check requires every module to be listed regardless.
      - "/providers/hcp-vault-secrets"
      - "/providers/heroku"
      - "/providers/infisical"
      - "/providers/supabase"
      - "/providers/https"
      # Bitwarden Secrets Manager. Standard library only, on top of httpcore, and
      # deliberately so: it decrypts client side with crypto/hkdf, crypto/aes and
      # crypto/hmac rather than taking Bitwarden's cgo Rust SDK. Same reasoning as
      # https above for why the entry stays despite rarely firing.
      - "/providers/bitwarden"
      # Not a vendor: the vendor-neutral OpenFeature SDK, so this one ref reaches
      # whichever provider the application installed, including vendors with no
      # dedicated module above.
      - "/providers/openfeature"
      # The client half of the config server: a mamori:// provider that resolves
      # binding names against a running server rather than an upstream ref.
      - "/providers/mamori"
      # The config server. It concentrates every backend credential its bindings
      # touch into one process, so it is the highest-blast-radius module here and
      # the one that least tolerates a stale dependency.
      - "/server"
      # Extensions
      - "/x/authjwt"
      - "/x/otel"
      - "/x/prom"
      - "/cmd/mamori"
    schedule: { interval: weekly }
    groups:
      go-dependencies:
        patterns: ["*"]
    labels: [dependencies, go]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]

  # Docs site (npm)
  - package-ecosystem: npm
    directory: "/site"
    schedule: { interval: weekly }
    labels: [dependencies, docs]
    groups:
      npm-dependencies:
        patterns: ["*"]
